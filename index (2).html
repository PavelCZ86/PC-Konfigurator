<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PC Konfigurátor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: workbench — parts catalog | antistatic mat with the open case | build sheet */
:root{
  /* single committed look: blue-black workshop */
  --bg:#0b1628; --panel:rgba(26,43,72,.85); --panel-2:#1f3150; --ink:#eaf1fa; --muted:#a2b5cf; --line:#2f4670;
  --accent:#5b8cff; --accent-ink:#ffffff; --accent-soft:#1a2b4f;
  --ok:#5fcf8f; --ok-soft:#12301f; --warn:#e9b85e; --warn-soft:#33270f; --err:#f2786d; --err-soft:#3a1a18;
  --mat:#3f5268; --mat-grid:rgba(200,220,255,.08); --mat-ink:rgba(255,255,255,.78);
  --slot-line:rgba(255,255,255,.55); --slot-fill:rgba(255,255,255,.07); --slot-text:rgba(255,255,255,.88); --hot:#ffd166;
  --thumb:#16243a; --danger:#e5484d; --danger-ink:#ffffff;
  --f-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);background-image:radial-gradient(900px 520px at 12% -8%,rgba(70,124,232,.42),transparent 70%),radial-gradient(800px 600px at 95% 110%,rgba(46,94,190,.34),transparent 70%),linear-gradient(165deg,#17325f 0%,#0f2143 45%,#081226 100%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand totals";align-items:center;gap:4px 20px;padding-block:0 12px}
.brand{grid-area:brand;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:32px;letter-spacing:.01em;margin:0;line-height:1}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.2}
.totals{grid-area:totals;justify-self:end;max-width:380px;display:flex;align-items:center;gap:3px 14px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:flex;flex-direction:column;gap:0}
.stat small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.err{background:var(--err-soft);color:var(--err)}
.hbtns{display:flex;gap:6px;flex-basis:100%;justify-content:flex-end}
.hbtns .btn{padding:3px 10px;font-size:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
.btn:hover{filter:brightness(1.1)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink);font-weight:600}
.btn.danger:hover{filter:brightness(1.1)}
.seg{display:flex;gap:4px;padding:3px;background:#2e3f68;border:1px solid #4a5f92;border-radius:9px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:5px 6px;font-size:12.5px;font-weight:500;color:#dbe4f5;display:flex;justify-content:center;gap:5px}
.seg button span{font-variant-numeric:tabular-nums;opacity:.7}
.seg button:hover{background:rgba(255,255,255,.08)}
.seg button[aria-pressed="true"]{background:#5446a8;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.empty-list{padding:18px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px;text-align:center}

main.app{flex:1;min-height:0;display:grid;gap:0 16px;padding-block:12px 16px;
  grid-template-columns:minmax(330px,380px) minmax(0,1fr) minmax(280px,330px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"cat head head" "cat stage sum"}
header.top{grid-area:head}
.col{min-height:0;min-width:0;display:flex;flex-direction:column}
.cat{grid-area:cat} .stagecol{grid-area:stage} .sum{grid-area:sum}

/* catalog */
.tabs{flex:none;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:3px 3px 10px;scrollbar-width:thin}
.cathead,.seg{flex:none}
.tab{flex:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:12px 14px;font-size:13px;font-weight:500;line-height:1.2;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab .dot{flex:none}
.tab:hover{filter:brightness(1.1)}
.tab .dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted)}
.tab .dot.on{background:var(--ok);border-color:var(--ok)}
.tab[aria-selected="true"]{background:#2f63e6;color:#fff;border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35);font-weight:600}
.tab[aria-selected="true"] .dot{border-color:#fff}
.tab .dot{border-color:rgba(255,255,255,.85)}
.cathead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 8px}
.cathead h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0}
.cathead span{font-size:12px;color:var(--muted)}
.list{overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px;min-height:0}
.card{display:grid;grid-template-columns:108px minmax(0,1fr);gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:grab;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--accent)}
/* lighter blue cards in the catalog */
.card{background:linear-gradient(180deg,#3563a8,#2c5596);border-color:rgba(170,200,255,.35)}
.card:hover{border-color:#cfe0ff}
.card .code,.card .chips li{color:#d7e4f8}
.card .chips li{background:rgba(255,255,255,.14)}
.card .sold{color:#d9e7ff}
.card .rank{color:rgba(255,255,255,.85)}
.card .btn.primary{background:#1550d8;border-color:rgba(255,255,255,.55)}
.card .btn:not(.primary):not(.danger){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.card:active{cursor:grabbing}
.card.is-in{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.thumb{position:relative;background:var(--thumb);border-radius:7px;height:84px;display:grid;place-items:center;padding:6px}
.rank{position:absolute;left:5px;top:4px;font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--muted)}
.sold{font-size:11.5px;color:var(--accent);font-weight:500}
.thumb svg{width:100%;height:100%;display:block}
.info{min-width:0;display:flex;flex-direction:column;gap:4px}
.info h3{margin:0;font-size:14px;font-weight:600;line-height:1.25;text-wrap:balance}
.code{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.chips{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.chips li{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--panel-2);color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.price{font-family:var(--f-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;margin-right:auto}
.flag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px}
.flag.err{background:var(--err-soft);color:var(--err)} .flag.warn{background:var(--warn-soft);color:var(--warn)} .flag.in{background:var(--ok-soft);color:var(--ok)}
.card .btn{padding:4px 12px}

/* stage */
.stage{position:relative;flex:1;min-height:0;border-radius:14px;border:1px solid rgba(180,205,240,.18);background-color:var(--mat);
  background-image:linear-gradient(var(--mat-grid) 1px,transparent 1px),linear-gradient(90deg,var(--mat-grid) 1px,transparent 1px);
  background-size:24px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 16px 12px;transition:box-shadow .2s}
.stage.drag{box-shadow:inset 0 0 0 3px var(--hot)}
.stage > svg{flex:1;min-height:0;width:88%;display:block}
[hidden]{display:none!important}
.mathint{align-self:stretch;font-size:12.5px;color:var(--mat-ink)}
.ghost{fill:var(--slot-fill);stroke:var(--slot-line);stroke-width:1.5;stroke-dasharray:6 5}
.ghost-t{fill:var(--slot-text);font-family:var(--f-body);font-size:13px;font-weight:500;pointer-events:none}
.zone{cursor:pointer}
.zone-hit{fill:transparent;stroke:none}
.zone.filled{cursor:grab;touch-action:none}
.zone.lifted{opacity:.25}
.drag-ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;filter:drop-shadow(0 12px 18px rgba(0,0,0,.4))}
.drag-ghost svg{width:100%;height:100%;display:block}
.drag-ghost .tag{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:var(--danger);color:var(--danger-ink);font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap;display:none}
.drag-ghost.out .tag{display:block}
.drag-ghost.out svg{opacity:.8}
body.dragging-part,body.dragging-part *{cursor:grabbing!important;user-select:none}
.zone:hover .zone-hit,.zone:focus-visible .zone-hit{stroke:rgba(255,255,255,.6);stroke-width:2}
.zone.hot .zone-hit{stroke:var(--hot);stroke-width:4;stroke-dasharray:10 6;animation:march 1s linear infinite}
.zone.hot .ghost{fill:rgba(255,209,102,.16)}
.zone.deny .zone-hit{stroke:var(--danger);stroke-width:4;stroke-dasharray:10 6}
.stage.deny{box-shadow:inset 0 0 0 3px var(--danger)}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:5;background:var(--danger);color:var(--danger-ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.card.is-blocked .thumb{opacity:.5}
.btn:disabled{opacity:.65;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line)}
.zone:focus{outline:none}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1);transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:translateY(-14px) scale(.96);opacity:.3}to{transform:none;opacity:1}}
@keyframes march{to{stroke-dashoffset:-32}}

/* summary */
.sheet{background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.sec{padding:10px 14px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h2{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.parts li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 8px;align-items:center;padding:4px 0;border-top:1px dashed var(--line)}
.parts li:first-child{border-top:0}
.parts .lbl{grid-column:1/-1;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.parts .lbl.done{color:var(--ok);font-weight:600}
.parts .lbl.done::before{content:"✓ "}
.parts .nm{font-size:13px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.parts .nm .code{display:block}
.parts .pr{font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.parts .empty{color:var(--muted);font-style:italic;font-size:13px}
.x{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:6px;font-size:16px;line-height:1}
.x:hover{background:var(--err-soft);color:var(--err)}
.link{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:500;padding:2px 4px}
.sumtotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:6px;border-top:2px solid var(--ink)}
.sumtotal b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;border-radius:5px;transition:width .3s}
.mnote{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:13px;align-items:start}
.checks .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.checks .ok .ic{background:var(--ok-soft);color:var(--ok)} .checks .warn .ic{background:var(--warn-soft);color:var(--warn)} .checks .err .ic{background:var(--err-soft);color:var(--err)}
.checks .todo .ic{background:var(--panel-2);color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);margin:0}

@media (max-width:1180px){
  header.top{grid-template-columns:minmax(0,1fr);grid-template-areas:"brand" "totals"}
  .totals{justify-self:center;justify-content:center}
  .hbtns{justify-content:center}
  html,body{height:auto}
  main.app{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto;row-gap:16px;grid-template-areas:"head head" "stage stage" "cat sum"}
  .stage{height:min(78vh,720px);flex:none}
  .list,.sheet{overflow:visible}
}
@media (max-width:760px){
  main.app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "stage" "cat" "sum"}
  .stage{height:auto}
  .stage > svg{flex:none;width:92%;height:auto}
  .card{grid-template-columns:92px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){ .pop,.zone.hot .zone-hit{animation:none} .card{transition:none} }
</style>
</head>
<body>



<main class="app">
<header class="top">
  <div class="brand">
    <h1><span>PC</span> Konfigurátor</h1>
    <p>Sestav si PC. Přetáhni díly z katalogu na podložku a skládej počítač.</p>
  </div>
  <div class="totals">
    <div class="stat"><small>Cena sestavy</small><b id="tPrice">0 Kč</b></div>
    <div class="stat"><small>Odběr</small><b id="tWatt">0 W</b></div>
    <span id="tStatus" class="pill ok">—</span>
    <div class="hbtns">
      <button class="btn" id="bDemo" type="button">Ukázková sestava</button>
      <button class="btn" id="bClear" type="button">Vyprázdnit</button>
    </div>
  </div>
</header>
  <section class="col cat" aria-label="Katalog dílů">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="cathead"><h2 id="catTitle"></h2><span id="catCount"></span></div>
    <div class="seg" id="seg" role="group" aria-label="Filtr platformy" hidden></div>
    <div class="list" id="list"></div>
  </section>

  <section class="col stagecol" aria-label="Skříň">
    <div class="stage" id="stage">
      <div class="toast" id="toast" role="status" hidden></div>
      <svg id="rig" viewBox="0 0 600 640" role="img" aria-label="Sestavovaný počítač"></svg>
      <div class="mathint" id="hint">Táhni díl sem, nebo klikni na <b>Vložit</b>. Klik na díl ve skříni otevře jeho kategorii.</div>
    </div>
  </section>

  <aside class="col sum" aria-label="Souhrn sestavy">
    <div class="sheet">
      <div class="sec"><h2>Sestava <small id="sCount"></small></h2><ul class="parts" id="parts"></ul>
        <div class="sumtotal"><span>Celkem</span><b id="sPrice">0 Kč</b></div></div>
      <div class="sec"><h2>Upozornění</h2><ul class="checks" id="checks"></ul><div class="meter"><i id="mBar"></i></div><div class="mnote" id="mNote"></div></div>
    </div>
  </aside>
</main>

/* ---------- drawings ---------- */
function fan(cx,cy,r,blade,frame){
  let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${frame}"/><circle cx="${cx}" cy="${cy}" r="${r-2}" fill="#0f1114"/>`;
  const by=(cy-r*0.52).toFixed(1);
  for(let i=0;i<7;i++) s+=`<ellipse cx="${cx}" cy="${by}" rx="${(r*0.2).toFixed(1)}" ry="${(r*0.4).toFixed(1)}" fill="${blade}" transform="rotate(${(i*51.43).toFixed(1)} ${cx} ${cy}) rotate(24 ${cx} ${by})"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${(r*0.3).toFixed(1)}" fill="#24282e"/><circle cx="${cx}" cy="${cy}" r="${(r*0.12).toFixed(1)}" fill="${blade}"/>`;
  return s;
}
function cpuDraw(p){
  let s=`<rect x="3" y="3" width="94" height="94" rx="5" fill="${PCB}"/>`;
  for(let k=0;k<11;k++){const x=8+k*8;s+=`<rect x="${x}" y="6" width="3" height="2" fill="${GOLD}"/><rect x="${x}" y="92" width="3" height="2" fill="${GOLD}"/>`;}
  s+=`<rect x="15" y="15" width="70" height="70" rx="7" fill="#b7bec7"/><rect x="18" y="18" width="64" height="64" rx="5" fill="#d3d8de"/>`;
  s+=`<text x="50" y="42" text-anchor="middle" font-family="Chakra Petch,sans-serif" font-weight="700" font-size="12" fill="${p.tone}">${esc(p.brand)}</text>`;

  s+=`<text x="50" y="69" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="4.6" fill="#69717c">${esc(p.code)}</text>`;
  return s+`<path d="M6 94 L13 94 L6 87Z" fill="${GOLD}"/>`;
}

function lift(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,c=(v,a)=>Math.min(255,v+a).toString(16).padStart(2,'0');return '#'+c(r,26)+c(g,36)+c(b,52);}

function ramStick(p){
  let s=`<rect x="0" y="6" width="200" height="22" fill="${PCB}"/>`;
  for(let i=0;i<46;i++){const x=3+i*4.2;if(x>92&&x<104)continue;s+=`<rect x="${x.toFixed(1)}" y="28" width="2.6" height="6" fill="${GOLD}"/>`;}
  s+=`<rect x="0" y="0" width="200" height="27" rx="3" fill="${p.tone}" stroke="rgba(0,0,0,.3)"/>`;

  s+=`<text x="10" y="20" font-family="Chakra Petch,sans-serif" font-weight="700" font-size="10" fill="${p.ink}">${esc(p.short)}</text>`;

/* ---------- logic ---------- */
function estimate(b){ let w=60; if(b.cpu)w+=b.cpu.tdp; if(b.gpu)w+=b.gpu.tdp; if(b.ram)w+=10; if(b.ssd)w+=8; if(b.cooler)w+=5; return w; }
const recPSU=e=>Math.ceil(e*1.3/50)*50;
function checks(b){
  const o=[], add=(level,text,cats,short,block)=>o.push({level,text,cats,short,block});
  const {cpu,mb,ram,gpu,psu,cooler}=b, cs=b.case;
  if(cpu&&mb) cpu.socket===mb.socket?add('ok',`Patice ${cpu.socket} sedí`,['cpu','mb']):add('err',`Procesor má patici ${cpu.socket}, deska ${mb.socket}`,['cpu','mb'],'Jiná patice',true);
  if(ram&&mb) ram.type===mb.ram?add('ok',`Paměť ${ram.type} sedí do desky`,['ram','mb']):add('err',`Deska bere ${mb.ram}, paměť je ${ram.type}`,['ram','mb'],`Deska chce ${mb.ram}`,true);
  if(mb&&cs) cs.forms.includes(mb.form)?add('ok',`Deska ${mb.form} se vejde do skříně`,['mb','case']):add('err',`Skříň pojme jen ${cs.forms.join(', ')}, deska je ${mb.form}`,['mb','case'],'Nevejde se',true);
  if(gpu&&cs) gpu.len<=cs.gpuMax?add('ok',`Grafika ${gpu.len} mm, místo ${cs.gpuMax} mm`,['gpu','case']):add('err',`Grafika má ${gpu.len} mm, skříň pojme ${cs.gpuMax} mm`,['gpu','case'],'Moc dlouhá',true);
  if(cooler&&cs) cooler.height<=cs.coolerMax?add('ok',`Chladič ${cooler.height} mm, místo ${cs.coolerMax} mm`,['cooler','case']):add('err',`Chladič má ${cooler.height} mm, skříň pojme ${cs.coolerMax} mm`,['cooler','case'],'Moc vysoký',true);
  if(cooler&&cpu){
    if(!cooler.sockets.includes(cpu.socket)) add('err',`Chladič nepodporuje patici ${cpu.socket}`,['cooler','cpu'],'Jiná patice',true);
    else if(cpu.tdp>cooler.tdpMax) add('warn',`Chladič uchladí ${cooler.tdpMax} W, procesor má ${cpu.tdp} W`,['cooler','cpu'],'Slabý chladič');
    else add('ok',`Chladič zvládne ${cpu.tdp} W procesoru`,['cooler','cpu']);
  }
  if(cpu&&!cpu.igpu&&!gpu) add('err','Procesor nemá integrovanou grafiku, bez grafické karty nebude obraz',['cpu'],'Chce grafiku');
  if(psu){ const e=estimate(b), r=recPSU(e);
    if(psu.watt<e) add('err',`Zdroj ${psu.watt} W nestačí na odběr ≈ ${e} W`,['psu','gpu','cpu'],'Slabý zdroj');
    else if(psu.watt<r) add('warn',`Zdroj ${psu.watt} W je na hraně, doporučeno ${r} W`,['psu','gpu','cpu'],'Zdroj na hraně');
    else add('ok',`Zdroj ${psu.watt} W stačí (doporučeno ${r} W)`,['psu']);
  }
  return o;
}
function issueFor(p){
  const b=parts(build); b[p.cat]=p;
  const list=checks(b).filter(c=>c.level!=='ok'&&c.short!=='Chce grafiku'&&c.cats.includes(p.cat));
  return list.find(c=>c.level==='err')||list[0]||null;
}

}

function cable(d,w,col='#1b1e23'){return `<path d="${d}" fill="none" stroke="#07080a" stroke-width="${w+3}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="${Math.max(1,w/5)}" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round"/>`;}

function renderTabs(){
  $('tabs').innerHTML=TABS.map(c=>`<button class="tab" role="tab" type="button" data-tab="${c}" aria-selected="${c===tab}"><span class="dot${build[c]?' on':''}"></span>${CAT[c].label}</button>`).join('');
  const t=$('tabs'), sel=t.querySelector('[aria-selected="true"]'); if(sel&&sel.offsetLeft!=null){ const l=sel.offsetLeft-t.offsetLeft; if(l<t.scrollLeft||l+sel.offsetWidth>t.scrollLeft+t.clientWidth) t.scrollLeft=l-8; }
}
const PLATFORM={
  cpu:{opts:['AMD','Intel'],of:p=>p.brand==='intel'?'Intel':'AMD'},
  mb:{opts:['AMD','Intel'],of:p=>p.socket.startsWith('LGA')?'Intel':'AMD'},
  ram:{opts:['DDR4','DDR5'],of:p=>p.type},
  gpu:{opts:['GeForce','Radeon'],of:p=>/geforce/i.test(p.name)?'GeForce':'Radeon'}
};
const filt={};
function renderSeg(all){
  const pf=PLATFORM[tab], seg=$('seg');
  if(!pf){seg.hidden=true;seg.innerHTML='';return;}
  const cur=filt[tab]||'all';
  seg.hidden=false;
  seg.innerHTML=[['all','Vše',all.length],...pf.opts.map(o=>[o,o,all.filter(p=>pf.of(p)===o).length])]
    .map(([v,l,n])=>`<button type="button" data-filter="${v}" aria-pressed="${cur===v}">${l}</button>`).join('');
}
function renderList(){
  const grp=p=>p.est?2:(p.sold>0?0:(p.alza?1:0));
  // processors: newest generation first, then higher tier (Ryzen 9 > 7 > 5), then price
  const cpuKey=p=>{const n=p.name; let m=n.match(/Ryzen (\d) (\d)\d{3}/); if(m) return [0,+m[2],+m[1]];
    m=n.match(/Core Ultra (\d) (\d)(\d)/); if(m) return [1,20+ +m[2],+m[1]];
    m=n.match(/Core i(\d)-(\d\d)/); if(m) return [1,+m[2],+m[1]]; return [2,0,0];};
  const cpuSort=(a,b)=>{const x=cpuKey(a),y=cpuKey(b); return (x[0]-y[0])||(y[1]-x[1])||(y[2]-x[2])||(b.price-a.price);};
  const all=PARTS.filter(p=>p.cat===tab).sort(tab==='cpu'?cpuSort:(a,b)=>(grp(a)-grp(b))||(b.sold-a.sold)||((a.alzaRank||99)-(b.alzaRank||99))||((a.alzaTop||99)-(b.alzaTop||99))||(b.price-a.price));
  renderSeg(all);
  const pf=PLATFORM[tab], cur=filt[tab]||'all';
  const items=pf&&cur!=='all'?all.filter(p=>pf.of(p)===cur):all;
  $('catTitle').textContent=CAT[tab].label;
  $('catCount').textContent=`${items.length} ${items.length<5?'položky':'položek'}`;
  if(!items.length){ $('list').innerHTML=`<div class="empty-list">Mezi 10 nejprodávanějšími teď není žádný díl ${esc(cur)}.</div>`; return; }
  $('list').innerHTML=items.map((p,ix)=>{
    const inB=build[p.cat]===p.id, iss=inB?null:issueFor(p), bl=inB?null:blocker(p);
    const flag=inB?`<span class="flag in">Ve skříni${p.cat==='ram'?` ×${ramMods()}`:''}</span>`:iss?`<span class="flag ${iss.level}" title="${esc(iss.text)}">${esc(iss.short)}</span>`:'';
    return `<article class="card${inB?' is-in':''}${bl?' is-blocked':''}" draggable="true" data-id="${p.id}">
      <div class="thumb">${thumb(p)}</div>
      <div class="info"><h3>${esc(p.name)}</h3><div class="code">${esc(p.code)}</div>
        <ul class="chips">${p.spec.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        <div class="row"><span class="price">${fmt(p.price)}</span>${flag}
          ${bl?`<button class="btn" type="button" disabled title="${esc(bl.text)}">Nelze vložit</button>`:`${inB&&p.cat==='ram'&&ramMods()+p.sticks<=4?`<button class="btn primary" type="button" data-act="add" data-id="${p.id}">+ ${p.sticks===1?'Modul':'Sada'}</button>`:''}<button class="btn ${inB?'danger':'primary'}" type="button" data-act="${inB?'remove':'add'}" data-id="${p.id}">${inB?'Vyjmout':'Vložit'}</button>`}</div>
      </div></article>`;}).join('');
}
function renderSummary(){
  const b=parts(build), list=checks(b);
  const order=['case','mb','cpu','cooler','ram','gpu','ssd','psu'];
  const total=Object.values(b).reduce((a,p)=>a+(p.cat==='ram'?ramPrice(p):p.price),0), n=Object.keys(b).length;
  $('parts').innerHTML=order.map(c=>{const p=b[c];
    return `<li><span class="lbl${p?' done':''}">${CAT[c].label}</span>${p?`<span class="nm">${esc(p.name)}${c==='ram'?` <b>· ${ramMods()} ${ramMods()===1?'modul':ramMods()<5?'moduly':'modulů'}</b>`:''}</span><span class="pr">${fmt(c==='ram'?ramPrice(p):p.price)}</span><button class="x" type="button" data-act="remove" data-id="${p.id}" aria-label="Vyjmout ${esc(p.name)}">×</button>`
      :`<span class="empty">nevybráno</span><span></span><button class="link" type="button" data-tab="${c}">Vybrat</button>`}</li>`;}).join('');
  $('sCount').textContent=`${n} z 8 dílů`;
  $('sPrice').textContent=$('tPrice').textContent=fmt(total);
  const e=estimate(b), r=recPSU(e); $('tWatt').textContent=`≈ ${e} W`;
  const bar=$('mBar');
  if(b.psu){const pct=Math.min(100,e/b.psu.watt*100), col=b.psu.watt<e?'var(--err)':b.psu.watt<r?'var(--warn)':'var(--ok)';
    bar.style.width=pct+'%'; bar.style.background=col;
    $('mNote').textContent=`Odběr ≈ ${e} W z ${b.psu.watt} W (${Math.round(pct)} %). Doporučený zdroj: ${r} W.`;}
  else {bar.style.width='0';$('mNote').textContent=`Odběr ≈ ${e} W. Doporučený zdroj: aspoň ${r} W.`;}
  const missing=order.filter(c=>!b[c]);
  const icon={ok:'✓',warn:'!',err:'×',todo:'·'};
  const notes=list.filter(c=>c.level!=='ok').map(c=>({level:'warn',text:c.text}));
  if(!notes.length) notes.push(missing.length?{level:'todo',text:'Zatím bez upozornění. Nekompatibilní díly do skříně nepůjdou vložit.'}:{level:'ok',text:'Sestava je kompletní a díly k sobě pasují.'});
  $('checks').innerHTML=notes.map(c=>`<li class="${c.level}"><span class="ic">${icon[c.level]}</span><span>${esc(c.text)}</span></li>`).join('');
  const errs=list.filter(c=>c.level==='err').length, warns=list.filter(c=>c.level==='warn').length, st=$('tStatus');
  if(errs){st.className='pill err';st.textContent=errs===1?'1 problém':`${errs} ${errs<5?'problémy':'problémů'}`;}
  else if(warns){st.className='pill warn';st.textContent=warns===1?'1 varování':`${warns} varování`;}
  else if(missing.length){st.className='pill warn';st.textContent=`Chybí ${missing.length} ${missing.length===1?'díl':missing.length<5?'díly':'dílů'}`;}
  else {st.className='pill ok';st.textContent='Sestava je kompletní';}
}
function render(){renderTabs();renderList();renderStage();renderSummary();popCat=null;}

/* ---------- actions ---------- */
function blocker(p){const b=parts(build); b[p.cat]=p; return checks(b).find(c=>c.block&&c.cats.includes(p.cat))||null;}
let toastT;
function toast(msg){const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true;},3200);}
function install(id){const p=BY[id]; if(!p) return;
  if(p.cat==='ram'&&build.ram===id){ const n=ramMods()+p.sticks; if(n>4){ toast('Všechny 4 sloty pro RAM jsou obsazené.'); return; } ramN=n; popCat='ram'; save(); render(); return; }
  const bl=blocker(p); if(bl){ toast(`Nejde vložit: ${bl.text}.`); return; } if(p.cat==='ram') ramN=p.sticks; build[p.cat]=id; popCat=p.cat; tab=p.cat; save(); render();}
function remove(id){const p=BY[id]; if(p&&build[p.cat]===id){delete build[p.cat]; if(p.cat==='ram') ramN=0; save(); render();}}
function setTab(c,scroll){tab=c; renderTabs(); renderList(); if(scroll&&innerWidth<=1180) $('tabs').scrollIntoView({behavior:'smooth',block:'start'});}

document.addEventListener('click',e=>{
  const f=e.target.closest('[data-filter]'); if(f){ filt[tab]=f.dataset.filter; renderList(); return; }
  const t=e.target.closest('[data-act],[data-tab]'); if(!t) return;
  if(t.dataset.act==='add') install(t.dataset.id);
  else if(t.dataset.act==='remove') remove(t.dataset.id);
  else if(t.dataset.tab) setTab(t.dataset.tab, t.classList.contains('link'));
});
let suppressClick=false;
$('rig').addEventListener('click',e=>{if(suppressClick){suppressClick=false;return;} const z=e.target.closest('.zone'); if(z) setTab(z.dataset.cat,true);});
$('rig').addEventListener('keydown',e=>{const z=e.target.closest('.zone'); if(z&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setTab(z.dataset.cat,true);}});
$('bDemo').onclick=()=>{build={...DEMO}; save(); render();};
$('bClear').onclick=()=>{build={}; ramN=0; tab='case'; save(); render();};

const stage=$('stage');
document.addEventListener('dragstart',e=>{
  const c=e.target.closest&&e.target.closest('.card'); if(!c) return;
  dragId=c.dataset.id; try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='copy';}catch(_){}
  const denied=!!blocker(BY[dragId]);
  stage.classList.add(denied?'deny':'drag');
  const z=$('rig').querySelector(`.zone[data-cat="${BY[dragId].cat}"]`); if(z) z.classList.add(denied?'deny':'hot');
});
document.addEventListener('dragend',()=>{dragId=null; stage.classList.remove('drag','deny'); $('rig').querySelectorAll('.hot,.deny').forEach(z=>z.classList.remove('hot','deny'));});
stage.addEventListener('dragover',e=>{if(dragId){e.preventDefault(); e.dataTransfer.dropEffect='copy';}});
stage.addEventListener('drop',e=>{e.preventDefault(); const id=dragId||e.dataTransfer.getData('text/plain'); stage.classList.remove('drag','deny'); dragId=null; install(id);});

/* drag a placed part out of the case to remove it */
(function(){
  const rig=$('rig'); let d=null;
  const toScreen=(x,y)=>{const m=rig.getScreenCTM(); return {x:m.a*x+m.c*y+m.e, y:m.b*x+m.d*y+m.f};};
  function isOut(cx,cy,cat){
    const a=toScreen(24,24), b=toScreen(576,620), r={left:a.x,top:a.y,right:b.x,bottom:b.y};
    return cx<r.left||cx>r.right||cy<r.top||cy>r.bottom;
  }
  rig.addEventListener('pointerdown',e=>{
    if(e.button>0) return;
    // an empty slot outline (e.g. the cooler ring over the CPU) may sit on top, so look through it for a placed part
    const z=e.target.closest('.zone.filled')||document.elementsFromPoint(e.clientX,e.clientY).map(n=>n.closest&&n.closest('.zone.filled')).find(Boolean); if(!z) return;
    const id=build[z.dataset.cat]; if(!id) return;
    d={z,id,cat:z.dataset.cat,sx:e.clientX,sy:e.clientY,started:false,ghost:null,ox:0,oy:0};
  });
  window.addEventListener('pointermove',e=>{
    if(!d) return;
    if(!d.started){
      if(Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<6) return;
      d.started=true;
      const r=d.z.getBoundingClientRect(), w=Math.max(60,Math.min(r.width,320)), h=Math.max(40,Math.min(r.height,260));
      const g=document.createElement('div'); g.className='drag-ghost';
      g.style.width=w+'px'; g.style.height=h+'px';
      g.innerHTML=thumb(BY[d.id])+'<span class="tag">Pustit = vyjmout</span>';
      document.body.appendChild(g); d.ghost=g; d.ox=w/2; d.oy=h/2;
      d.z.classList.add('lifted'); document.body.classList.add('dragging-part');
    }
    e.preventDefault();
    d.ghost.style.transform=`translate(${e.clientX-d.ox}px,${e.clientY-d.oy}px)`;
    d.ghost.classList.toggle('out',isOut(e.clientX,e.clientY,d.cat));
  },{passive:false});
  function end(e){
    if(!d) return;
    const cur=d; d=null;
    if(!cur.started) return;
    suppressClick=true; setTimeout(()=>{suppressClick=false;},0);
    cur.ghost.remove(); document.body.classList.remove('dragging-part'); cur.z.classList.remove('lifted');
    if(e.type==='pointerup' && isOut(e.clientX,e.clientY,cur.cat)) remove(cur.id);
  }
  window.addEventListener('pointerup',end);
  window.addEventListener('pointercancel',end);
})();
render();
})();
</script>
